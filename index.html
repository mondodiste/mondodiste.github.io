<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il mondo di Ste</title>
    <link rel="apple-touch-icon" href="foto/logo.jpg">
    <link rel="icon" type="image/jpeg" href="foto/logo.jpg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0c0c0c;
            color: #dcdcdc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }
        header {
            padding: 45px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
            gap: 25px;
        }
        .logo {
            font-size: 1.25rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 700;
            color: #ffffff;
        }
        nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        nav a {
            color: #777;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s ease;
            cursor: pointer;
            padding: 5px 8px;
        }
        nav a:hover, nav a.active {
            color: #ffffff;
        }
        /* Pulsante Contatti separato e stilizzato */
        .nav-contact {
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px 16px !important;
            color: #ccc !important;
            transition: all 0.3s ease !important;
        }
        .nav-contact:hover {
            border-color: #777;
            background-color: rgba(255, 255, 255, 0.03);
            color: #ffffff !important;
        }

        .intro {
            max-width: 1100px;
            margin: 0 auto 35px auto;
            padding: 0 20px;
            color: #888;
            font-size: 0.95rem;
            font-style: italic;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .gallery {
            max-width: 1100px;
            margin: 20px auto 80px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 45px;
        }
        .photo-card {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 24px;
            background-color: #141414;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            cursor: zoom-in;
            border: 1px solid #1f1f1f;
        }
        .photo-card img {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: cover;
            display: block;
            margin: 0 auto;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .photo-card:hover img {
            transform: scale(2.0);
        }
        
        .photo-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 25px 20px 25px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
        }
        .photo-title {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #555;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Lightbox ottimizzato con download */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.96);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        .lightbox-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90vw;
            max-height: 85vh;
        }
        .lightbox img {
            max-width: 95vw;
            max-height: 88vh; /* <-- Più grande, riempie quasi tutto lo schermo */
            object-fit: contain;
            border-radius: 6px;
        }
        .download-btn {
            margin-top: 18px;
            background-color: transparent;
            border: 1px solid #444;
            color: #ccc;
            padding: 8px 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .download-btn:hover {
            border-color: #fff;
            background-color: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        /* Stili Modale Contatti */
        .modal {
            display: none;
            position: fixed;
            z-index: 1100;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background-color: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 35px;
            width: 100%;
            max-width: 480px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }
        .close-modal {
            position: absolute;
            top: 18px;
            right: 22px;
            color: #777;
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }
        .close-modal:hover {
            color: #ffffff;
        }
        .modal-content h2 {
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            background-color: #0c0c0c;
            border: 1px solid #282828;
            border-radius: 6px;
            padding: 12px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #666;
        }
        .submit-btn {
            width: 100%;
            background-color: #ffffff;
            color: #0c0c0c;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background-color 0.3s, opacity 0.3s;
            margin-top: 8px;
        }
        .submit-btn:hover {
            background-color: #d2d2d2;
        }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #form-status {
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
            color: #a3d9a5;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Il mondo di Ste</div>
        <nav>
            <a class="active" onclick="filterGallery('all', this)">Galleria</a>
            <a onclick="filterGallery('paesaggi', this)">Paesaggi</a>
            <a onclick="filterGallery('fauna', this)">Fauna</a>
            <a onclick="filterGallery('macro', this)">Macro</a>
            <a class="nav-contact" onclick="openContactModal()">Contatti</a>
        </nav>
    </header>
    
    <div class="intro">
        <p>Il mio modo di fermare il tempo durante le uscite all'aria aperta: luce, montagne e incontri inaspettati.</p>
    </div>
    
    <main class="gallery" id="gallery-container">
    </main>

    <footer>
        &copy; 2026 Il Mondo di Ste
    </footer>

    <!-- Lightbox con pulsante Download Sfondo -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="" alt="Foto ingrandita">
            <a id="lightbox-download" href="" download class="download-btn">Scarica Sfondo</a>
        </div>
    </div>

    <!-- Modale Contatti -->
    <div id="contact-modal" class="modal" onclick="closeContactModalOnOutside(event)">
        <div class="modal-content">
            <span class="close-modal" onclick="closeContactModal()">&times;</span>
            <h2>Scrivimi</h2>
            <form id="contact-form" action="https://formspree.io/f/xnpdjdnp" method="POST">
                <div class="form-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" required placeholder="Il tuo nome">
                </div>
                <div class="form-group">
                    <label for="email">La tua Email</label>
                    <input type="email" id="email" name="email" required placeholder="nome@esempio.it">
                </div>
                <div class="form-group">
                    <label for="message">Messaggio</label>
                    <textarea id="message" name="message" rows="4" required placeholder="Scrivi qui il tuo messaggio..."></textarea>
                </div>
                <button type="submit" class="submit-btn" id="submit-btn">Invia Messaggio</button>
                <div id="form-status"></div>
            </form>
        </div>
    </div>

    <script>
        // Caricamento dinamico delle foto da foto.json
        fetch('foto.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('gallery-container');
                container.innerHTML = '';

                data.forEach(photo => {
                    const html = `
                        <div class="photo-wrapper" data-category="${photo.categoria}">
                            <div class="photo-card" onclick="openLightbox('foto/${photo.file}', '${photo.titolo}')">
                                <img src="foto/${photo.file}" alt="${photo.titolo}" loading="lazy">
                                <div class="photo-overlay">
                                    <span class="photo-title">${photo.titolo}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            })
            .catch(err => console.error('Errore nel caricamento delle foto:', err));

        function openLightbox(src, title) {
            const img = document.getElementById('lightbox-img');
            const downloadBtn = document.getElementById('lightbox-download');
            
            img.src = src;
            downloadBtn.href = src;
            
            // Suggerisce un nome file pulito per il download basato sul titolo
            const safeName = title ? title.toLowerCase().replace(/[^a-z0-9]/g, '_') + '.jpg' : 'sfondo_ste.jpg';
            downloadBtn.setAttribute('download', safeName);

            document.getElementById('lightbox').style.display = 'flex';
        }
        
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function filterGallery(category, element) {
            document.querySelectorAll('nav a:not(.nav-contact)').forEach(link => link.classList.remove('active'));
            if(element !== document.querySelector('.nav-contact')) {
                element.classList.add('active');
            }

            document.querySelectorAll('.photo-wrapper').forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Gestione Modale Contatti
        function openContactModal() {
            document.getElementById('contact-modal').style.display = 'flex';
            document.getElementById('form-status').textContent = '';
        }

        function closeContactModal() {
            document.getElementById('contact-modal').style.display = 'none';
        }

        function closeContactModalOnOutside(event) {
            if (event.target.id === 'contact-modal') {
                closeContactModal();
            }
        }

        // Invio asincrono tramite Formspree
        const form = document.getElementById('contact-form');
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            const status = document.getElementById('form-status');
            const btn = document.getElementById('submit-btn');
            const data = new FormData(event.target);

            btn.disabled = true;
            btn.textContent = 'Invio in corso...';

            try {
                const response = await fetch(event.target.action, {
                    method: form.method,
                    body: data,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    status.style.color = '#a3d9a5';
                    status.textContent = 'Messaggio inviato! Ti risponderò presto.';
                    form.reset();
                    setTimeout(() => {
                        closeContactModal();
                    }, 2000);
                } else {
                    status.style.color = '#ff8a80';
                    status.textContent = 'Qualcosa è andato storto. Riprova tra poco.';
                }
            } catch (error) {
                status.style.color = '#ff8a80';
                status.textContent = 'Errore di connessione. Riprova.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Invia Messaggio';
            }
        });
    </script>

</body>
</html>
