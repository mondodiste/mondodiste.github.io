<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mondo di Ste - Fotografia Naturalistica</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0e0e0e;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }
        header {
            padding: 40px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        .logo {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            color: #ffffff;
        }
        nav a {
            color: #888;
            text-decoration: none;
            margin-left: 25px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }
        nav a:hover, nav a.active {
            color: #ffffff;
        }
        .gallery {
            max-width: 1400px;
            margin: 20px auto 80px auto;
            padding: 0 30px;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }
        .photo-card {
            width: 100%;
            height: auto;
            max-height: 55vh;
            object-fit: cover;
            display: block;
            margin: 0 auto;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .photo-card img {
            width: 100%;
            height: auto;
            max-height: 85vh;
            object-fit: cover;
            display: block;
            margin: 0 auto;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .photo-card:hover img {
            transform: scale(1.2);
        }
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #555;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* Lightbox per visualizzazione a schermo intero */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        .lightbox img {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Mondo di Ste</div>
        <nav>
            <a href="#" class="active">Galleria</a>
            <a href="#">Paesaggi</a>
            <a href="#">Fauna</a>
            <a href="#">Macro</a>
        </nav>
    </header>

    <main class="gallery">
        <div class="photo-card" onclick="openLightbox('foto/passotonale.jpg')">
            <img src="foto/passotonale.jpg" alt="Passo Tonale" loading="lazy">
        </div>
        <div class="photo-card" onclick="openLightbox('foto/pianta1.jpg')">
            <img src="foto/pianta1.jpg" alt="Dettaglio botanico" loading="lazy">
        </div>
        <div class="photo-card" onclick="openLightbox('foto/scoiattolo1.jpg')">
            <img src="foto/scoiattolo1.jpg" alt="Scoiattolo" loading="lazy">
        </div>
    </main>

    <footer>
        &copy; 2026 Mondo di Ste &mdash; Tutti i diritti riservati
    </footer>

    <!-- Contenitore ingrandimento -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Foto ingrandita">
    </div>

    <script>
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>

</body>
</html>
