<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il mondo di Ste - Fotografia Naturalistica</title>
    <link rel="apple-touch-icon" href="foto/logo.jpg">
    <link rel="icon" type="image/jpeg" href="foto/logo.jpg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0e0e0e;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }
        header {
            padding: 40px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        .logo {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            color: #ffffff;
        }
        nav a {
            color: #888;
            text-decoration: none;
            margin-left: 25px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease;
            cursor: pointer;
        }
        .intro {
            max-width: 1100px;
            margin: 0 auto 30px auto;
            padding: 0 20px;
            color: #999;
            font-size: 1rem;
            font-style: italic;
            letter-spacing: 0.5px;
            text-align: center;
        }
        nav a:hover, nav a.active {
            color: #ffffff;
        }
        .gallery {
            max-width: 1100px;
            margin: 20px auto 80px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        .photo-card {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 6px;
            background-color: #161616;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            cursor: zoom-in;
        }
        .photo-card img {
            width: 100%;
            height: auto;
            max-height: 60vh;
            object-fit: cover;
            display: block;
            margin: 0 auto;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .photo-card:hover img {
            transform: scale(1.03);
        }
        
        .photo-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 25px 20px 20px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .photo-title {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 500;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        .like-btn {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .like-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .like-btn.liked {
            color: #ff4757;
            border-color: rgba(255, 71, 87, 0.4);
        }
        .like-btn span {
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #555;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        .lightbox img {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Il mondo di Ste</div>
        <nav>
            <a class="active" onclick="filterGallery('all', this)">Galleria</a>
            <a onclick="filterGallery('paesaggi', this)">Paesaggi</a>
            <a onclick="filterGallery('fauna', this)">Fauna</a>
            <a onclick="filterGallery('macro', this)">Macro</a>
        </nav>
    </header>
    
    <div class="intro">
        <p>Il mio modo di fermare il tempo durante le uscite all'aria aperta: luce, montagne e incontri inaspettati.</p>
    </div>
    
    <main class="gallery" id="gallery-container">
    </main>

    <footer>
        &copy; 2026 Il Mondo di Ste &mdash; Visite: <span id="busuanzi_value_site_pv">...</span>
    </footer>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Foto ingrandita">
    </div>

    <script>
        let currentCategory = 'all';

        fetch('foto.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('gallery-container');
                container.innerHTML = '';

                data.forEach(photo => {
                    const photoId = photo.file.replace(/\.[^/.]+$/, "");
                    const isLiked = localStorage.getItem('liked_' + photoId) ? 'liked' : '';
                    const savedCount = localStorage.getItem('count_' + photoId) || 0;
                    
                    const html = `
                        <div class="photo-wrapper" data-category="${photo.categoria}">
                            <div class="photo-card" onclick="openLightbox('foto/${photo.file}')">
                                <img src="foto/${photo.file}" alt="${photo.titolo}" loading="lazy">
                                <div class="photo-overlay">
                                    <span class="photo-title">${photo.titolo}</span>
                                    <button class="like-btn ${isLiked}" onclick="event.stopPropagation(); toggleLike('${photoId}', this)">
                                        ❤️ <span id="like-${photoId}">${savedCount}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            })
            .catch(err => console.error('Errore nel caricamento delle foto:', err));

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function filterGallery(category, element) {
            currentCategory = category;
            document.querySelectorAll('nav a').forEach(link => link.classList.remove('active'));
            element.classList.add('active');

            document.querySelectorAll('.photo-wrapper').forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function toggleLike(photoId, btn) {
            let countSpan = document.getElementById('like-' + photoId);
            if (!countSpan) return;
            let currentLikes = parseInt(countSpan.innerText) || 0;
            let likedKey = 'liked_' + photoId;
            let countKey = 'count_' + photoId;
            
            if (localStorage.getItem(likedKey)) {
                currentLikes--;
                if (currentLikes < 0) currentLikes = 0;
                localStorage.removeItem(likedKey);
                btn.classList.remove('liked');
            } else {
                currentLikes++;
                localStorage.setItem(likedKey, 'true');
                btn.classList.add('liked');
            }
            
            countSpan.innerText = currentLikes;
            localStorage.setItem(countKey, currentLikes);
        }
    </script>

    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

</body>
</html>
